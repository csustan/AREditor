<body>
    <!-- includes -->

    <script src="js/third_party/three.js/three.min.js"></script>
    <script src="js/ARnftThreejs.js"></script>
    <script src="js/third_party/ARnft.js"></script>

    <script>
        // NFT exports run without APP.js, so this template needs its own copy of the
        // light-target repair used by the regular marker-app export.
        function restoreTrackedLightTargets(root) {
            // SpotLights and DirectionalLights aim at a separate Object3D called a
            // "target" instead of using the light object's rotation. ObjectLoader
            // creates a new default target, so we must restore the exported target.
            const lightTargetLinks = [];

            // First collect the saved relationships while walking the loaded scene.
            root.traverse(function (object) {
                // The publishing code writes the target's unique ID into userData
                // because Three.js preserves userData when it writes and reads JSON.
                const targetUuid = object.userData && object.userData.__arLightTargetUuid;

                // Other light types do not aim at target objects and need no repair.
                if ((object.isSpotLight || object.isDirectionalLight) && typeof targetUuid === 'string') {
                    lightTargetLinks.push({ light: object, targetUuid: targetUuid });
                }
            });

            // Now every object is available, so reconnect each light to its exact target.
            lightTargetLinks.forEach(function (link) {
                // UUIDs are unique even when two target objects happen to share a name.
                const target = root.getObjectByProperty('uuid', link.targetUuid, true);

                if (target) {
                    // Replacing the default target restores the direction seen in the editor.
                    link.light.target = target;
                } else {
                    // A missing target should not prevent the rest of the AR scene from loading.
                    console.warn('Unable to restore tracked light target:', link.targetUuid);
                }
            });
        }

        const entities = [
            //ADD_MARKER_LOCATIONS_HERE
            //Markers should be added in this manner:s
            { name: 'generatedMarkerFile', markerUrl: "DataNFT/generatedMarkerFile" }

        ]
        let width = /* NFT_TRACKING_WIDTH */ 640;
        let height = /* NFT_TRACKING_HEIGHT */ 480;
        ARnft.ARnft.initWithEntities(width, height, entities,  'config-StanState.json', /* NFT_SHOW_STATS */ false)
            .then((nft) => {
                
                let testEntities = ARnft.ARnft.getEntities();
                //console.log("entities from getEntities static method: ", testEntities);

                document.addEventListener('containerEvent', function (ev) {

                    let canvas = document.getElementById('canvas');
                    let fov = 0.8 * 180 / Math.PI;
                    let ratio = width / height;
                    let config = {
                        "renderer": {
                            "alpha": true,
                            "antialias": true,
                            "context": null,
                            "precision": "mediump",
                            "premultipliedAlpha": true,
                            "stencil": true,
                            "depth": true,
                            "logarithmicDepthBuffer": true,
                            //<!-- renderer settings -->
                        },
                        "camera": {
                            "fov": fov,
                            "ratio": ratio,
                            "near": 0.01,
                            "far": 1000
                        }
                    }

                    let sceneThreejs = new ARnftThreejs.SceneRendererTJS(config, canvas, nft.uuid, true);
                    sceneThreejs.initRenderer();

                    //Test Code -- duplicated as needed, replace "[NameOfTheMarkerToTest]" with the marker you want to test
                    //window.addEventListener('getMatrixGL_RH-' + nft.uuid + '-' + '[NameOfTheMarkerToTest]', function() {
                    //    console.log('this is the [NameOfTheMarkerToTest]!');
                    //})

                    let nftAddTJS = new ARnftThreejs.NFTaddTJS(nft.uuid);
                    //Objects are added in this manner:
                    //nftAddTJS.add(cube, 'generatedMarkerFile', false);

                    let names = nftAddTJS.getNames();
                    // console.log(names);

                    // Script update events compiled from app.json editor scripts (populated after app.json loads)
                    let scriptUpdateEvents = [];
                    let animationMixers = [];
                    let scriptStartTime = performance.now();
                    let previousTickTime = performance.now();

                    //ADD_MARKER_MODEL_CONNECTIONS_HERE
                    //<!-- insert model -->

                    const tick = () => {
                        let now = performance.now();
                        let deltaSeconds = Math.max(0, (now - previousTickTime) / 1000);
                        previousTickTime = now;

                        for (let i = 0; i < animationMixers.length; i++) {
                            animationMixers[i].update(deltaSeconds);
                        }

                        for (let i = 0; i < scriptUpdateEvents.length; i++) {
                            try { scriptUpdateEvents[i]({ time: now - scriptStartTime, delta: 0 }); }
                            catch (e) { console.error(e.message || e, e.stack || ''); }
                        }
                        sceneThreejs.draw();
                        window.requestAnimationFrame(tick);
                    }
                    tick();

                })
            }).catch((error) => {
                console.log(error);
            });            
    </script>

</body>

</html>
